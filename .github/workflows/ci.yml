name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/TripPlanner.sln

      - name: Build
        run: dotnet build backend/TripPlanner.sln --no-restore --configuration Release

      - name: Format check
        run: dotnet format backend/TripPlanner.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Test
        run: |
          # No-op gracefully until test projects are added to the solution
          TEST_PROJECTS=$(find . -name "*.Tests.csproj" -o -name "*Tests.csproj" -o -name "*.Test.csproj" 2>/dev/null | head -1)
          if [ -z "$TEST_PROJECTS" ]; then
            echo "No test projects found — skipping dotnet test"
          else
            dotnet test backend/TripPlanner.sln --no-build --configuration Release
          fi

  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this covers typecheck too.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
