<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; text-align: center;">
    <div style="width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: left;">
        <div>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">Hello <strong style="color: #000000;">{{UserName}}</strong>,</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">You recently requested to reset your password. To proceed, please click the button below:</p>
            <p style="text-align: center; margin: 20px 0;">
                <a href="{{Url}}" style="display: inline-block; padding: 10px 20px; color: #ffffff; background-color: #007bff; text-decoration: none; border-radius: 5px; font-size: 16px;">Reset Password</a>
            </p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">The link will expire in <strong style="color: #000000;">1 hour</strong>.</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">If you did not request this, you can safely ignore this email.</p>
        </div>
        <div style="margin-top: 20px; font-size: 14px; color: #000000; text-align: left;">
            <p>Thank you,<br>Nhan Nguyen</p>
        </div>
    </div>
</body>
</html>
