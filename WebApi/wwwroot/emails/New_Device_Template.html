<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Device Login Alert</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; text-align: center;">
    <div style="width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: left;">
        <div>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">Hello <strong style="color: #000000;">{{UserName}}</strong>,</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">We noticed a login from a new device to your account. Here are the details:</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;"><strong style="color: #000000;">Device Id:</strong> {{DeviceId}}</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;"><strong style="color: #000000;">Device:</strong> {{DeviceInfo}}</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;"><strong style="color: #000000;">Location:</strong> {{LocationInfo}}</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;"><strong style="color: #000000;">Time:</strong> {{LoginTime}}</p>
            <p style="font-size: 16px; color: #000000; line-height: 1.6; margin: 10px 0;">If this was not you, please secure your account immediately.</p>
        </div>
        <div style="margin-top: 20px; font-size: 14px; color: #000000; text-align: left;">
            <p>Thank you,<br>Nhan Nguyen</p>
        </div>
    </div>
</body>
</html>
